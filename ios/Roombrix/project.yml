# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen && cd ios/Roombrix && xcodegen generate
name: Roombrix
options:
  bundleIdPrefix: com.inceptionaudio
  deploymentTarget:
    iOS: "17.0"
packages:
  RoombrixCore:
    path: ../../RoombrixCore
targets:
  Roombrix:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: RoombrixCore
        product: RoombrixDSP
      - package: RoombrixCore
        product: RoombrixAcoustics
      - package: RoombrixCore
        product: RoombrixGeometry
      - package: RoombrixCore
        product: RoombrixScoring
      - package: RoombrixCore
        product: RoombrixDiagnosis
      - package: RoombrixCore
        product: RoombrixValidation
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        # Documents folder visible in Files app / Finder so raw capture WAVs
        # can be handed back for CLI cross-verification.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: >-
          Roombrix listens to a test sweep played through your speakers to
          measure how your room behaves acoustically. Audio is processed
          on-device and never uploaded.
        NSCameraUsageDescription: >-
          Used by the optional room scan to capture your room's dimensions
          for acoustic predictions. Scans stay on your device.
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only in MVP; iPad deferred
